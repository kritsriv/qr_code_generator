<!DOCTYPE html>
<html>
<head>
  <link href="https://fonts.googleapis.com/css?family=Roboto:100,300,400,500,700,900" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/@mdi/font@6.x/css/materialdesignicons.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/vuetify@2.x/dist/vuetify.min.css" rel="stylesheet">

  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, minimal-ui">
</head>
<body>
  <div id="app">
    <v-app>
      <v-main>
        <v-container>
            <v-file-input
            accept=".csv"
            type="file"
            label="CSV file"
            @change="onFileChange"
          ></v-file-input>
        </v-container>
      </v-main>
    </v-app>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/vue@2.x/dist/vue.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/vuetify@2.x/dist/vuetify.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/alasql/0.3.7/alasql.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.9.2/xlsx.core.min.js"></script>
  
  <script>
    var data = [{a:1,b:1,c:1},{a:1,b:2,c:1},{a:1,b:3,c:1}, {a:2,b:1,c:1}];


    new Vue({
      el: '#app',
      vuetify: new Vuetify(),
      methods: {
        onFileChange(event) {
            const reader = new FileReader()
            reader.onload = () => {
                console.log(reader.result)
                alasql('SELECT * FROM xlsx(?,{headers:true})',[reader.result],function(data){
                console.log('result')
                console.log(data)
            });
            }
            // start reading the file. When it is done, calls the onload event defined above.
            reader.readAsBinaryString(event)

            console.log(event)
          

            // var res = alasql('SELECT * FROM FILE(?,{headers:true})',[file]);
            // console.log(res);
        }
      },
    })
  </script>
</body>
</html>
